<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>主持控制台 · 农家乐 Agricola</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌾</text></svg>">
<link rel="stylesheet" href="/css/main.css">
<link rel="stylesheet" href="/css/anim.css">
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div class="brand"><div class="logo">🏠</div><div>主持台<small>房间管理控制台</small></div></div>
    <div class="row" style="gap:10px">
      <a class="btn ghost small" href="/">← 首页</a>
      <a class="btn ghost small" data-open-tutorial href="javascript:void(0)">📖 教程</a>
      <span id="connState" class="conn hidden"><span class="dot on"></span>已连接</span>
    </div>
  </div>

  <!-- 头部：创建按钮 + 计数 -->
  <div class="card mt16" id="topCard">
    <div class="row spread">
      <div>
        <h2 class="mt0 mb8">🚜 全局房间</h2>
        <p class="muted mb0" id="topHint">所有浏览器共享同一房间池，最多 <b id="capMax">10</b> 间房间，已使用 <b id="usedCount">0</b>/<span id="capMax2">10</span>。</p>
      </div>
      <button id="btnCreate" class="btn big gold">＋ 新建房间</button>
    </div>
  </div>

  <!-- 房间列表 -->
  <div id="roomList" class="mt16 col">
    <div class="card soft" id="loadingCard">
      <p class="muted mt0 mb0">⏳ 正在加载全局房间…</p>
    </div>
  </div>

  <!-- 单房间管理模态（点列表项弹出） -->
  <div id="manageModal" class="modal-mask hidden">
    <div id="manageBox" class="modal" style="max-width:480px"></div>
  </div>
</div>

<script type="module" src="/js/host.js"></script>
<script type="module">
import { bindTutorialTriggers } from "/js/tutorial.js";
import { bindSfx } from "/js/sfx.js";
bindTutorialTriggers();
bindSfx();
</script>
</body>
</html>
